name: Grizzly provider 405 stock
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grizzly-provider-405
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check provider stock and send Discord alert
        env:
          GRIZZLY_API_KEY: ${{ secrets.GRIZZLY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 grizzly_405/check.py
      - name: Save availability state
        run: |
          if ! git diff --quiet -- grizzly_405/state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add grizzly_405/state.json
            git commit -m 'Update Grizzly provider 405 availability'
            git push
          fi
